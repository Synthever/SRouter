<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="24"
  height="24"
>
  <style>
    /* Mirrors the app's own brand block: the mark in --background on a
       --foreground square, inverting with the system theme. Same glyph the
       sidebar and login screen already draw, so the tab matches the product. */
    rect {
      fill: #0e0e0e;
    }
    g {
      stroke: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      rect {
        fill: #f5f5f5;
      }
      g {
        stroke: #141414;
      }
    }
  </style>
  <rect width="24" height="24" rx="6" />
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3" />
    <path d="M4.93 4.93l4.24 4.24" />
    <path d="M14.83 9.17l4.24-4.24" />
    <path d="M14.83 14.83l4.24 4.24" />
    <path d="M4.93 19.07l4.24-4.24" />
  </g>
</svg>